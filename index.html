<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Way: A Journey Through Bible Lands</title>
</head>
<body>
<div id="app">Loading&hellip;</div>
<script>
  // Opened by double-click (file://), the module script and content JSON
  // cannot load, so say so instead of hanging at "Loading...".
  // Served over http (npm run dev, or GitHub Pages), this never fires.
  if (location.protocol === "file:") {
    document.getElementById("app").textContent =
      "This page needs its local server and cannot run from a double-clicked file. " +
      "Open a terminal in the project folder, run: npm run dev — then open the " +
      "address it prints, usually localhost port 5173. Once the game is published " +
      "to its web address, no server step will be needed.";
  }
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
